<div style="margin-top: 30px;" *ngIf="objekat && currentTeren">
  <h3>Raspored - Kalendar</h3>

  <!-- Rotiranje terena -->
  <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
    <button (click)="prevTeren()" type="button">&lt;</button>
    <strong style="font-size: 1.2em;">Teren: {{ currentTeren.naziv }}</strong>
    <button (click)="nextTeren()" type="button">&gt;</button>
  </div>

  <!-- Navigacija po nedeljama -->
  <div style="display: flex; gap: 20px; margin-bottom: 10px;">
    <button (click)="prevWeek()" [disabled]="isPrevWeekDisabled" type="button">&lt; Prethodna nedelja</button>
    <button (click)="nextWeek()" type="button">Sledeca nedelja &gt;</button>
  </div>

  <!-- Kalendar Tabela -->
  <table border="1" style="border-collapse: collapse; width: 100%; text-align: center;">
    <thead>
      <tr>
        <th style="padding: 10px; width: 80px;">Vreme</th>
        <th *ngFor="let day of weekDays" style="padding: 10px;">
          {{ day | date:'EEEE, dd.MM.' }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let hour of hours">
        <td style="padding: 10px; font-weight: bold;">{{ hour }}:00 - {{ hour+1 }}:00</td>
        <td *ngFor="let day of weekDays" style="padding: 10px; height: 50px;" 
            [ngStyle]="{
              'background-color': getCellState(day, hour).type === 'siva' ? '#e0e0e0' : 
                                  getCellState(day, hour).type === 'zelena' ? '#c8e6c9' : '#ffcdd2',
              'color': getCellState(day, hour).type === 'siva' ? 'transparent' : 'black'
            }">
          {{ getCellState(day, hour).text }}
        </td>
      </tr>
    </tbody>
  </table>

</div>
